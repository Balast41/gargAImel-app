<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>GargAImel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="titlebar">
    <div class="titlebar-left">
    <button id="menuButton0" onclick="openNav()"><img src="img/Menu.svg" id="menuImg"></button>
    <button id="backButton" onclick="navigate('page-chat')" hidden><img src="img/left arrow.svg"></button>
    </div>
    <div class="titlebar-right">
      <img src="img/minus.svg" id="minimizeButton">
      <img src="img/square.svg" id="maximizeButton">
      <img src="img/x.svg" id="closeButton">
    </div>
  </header>
    <nav id="menu" class="menu">
      <div class="menu-header">
        <button id="menuButton1" onclick="closeNav()"><img src="img/Menu.svg" id="menuImg"></button>
        <span>GargAImel Chats</span>
        <img src="img/plus.svg" id="newChatButton">
      </div>
      <div class="menu-content">
        <input type="search" placeholder="Rechercher..." id="searchInput">
        <h3>Chats</h3>
      </div>
</nav>
<div id="overlay" class="overlay"></div>

  <main id="app">
  <div id="page-chat" class="page active">
  <h2>GargAImel maître du chiffrement, prêt à répondre à tes requêtes pour anéantir les Schtroumpfs !</h2>

  <div class="box">
    <img src="img/gargAImel2.png" id="gargAImel">
    <div class="textbox">
      <textarea id="userRequest" placeholder="Hi hi ! Que veux-tu savoir ?"></textarea>
      <br></br>
      <div class="icons">
        <div class="options">
          <img src="img/Icon.svg" id="fileButton">
          <img src="img/double arrow.svg" onclick="">
          <img src="img/mic.svg" onclick="">
        </div>
        <img src="img/send.svg" id="sendButton">
      </div>
    </div>
  </div>
  </div>

  <div id="page-discussion" class="page">
    <div class="discussion-box">
    <div id="messages"></div>
    <div class="textbox-discussion">
      <textarea id="userRequest" placeholder="Hi hi ! Que veux-tu savoir ?"></textarea>
      <br></br>
      <div class="icons">
        <div class="options">
          <img src="img/Icon.svg" id="fileButton">
          <img src="img/double arrow.svg" onclick="">
          <img src="img/mic.svg" onclick="">
        </div>
        <img src="img/send.svg" id="sendButtonDiscussion">
      </div>
      </div>
    </div>

  <div id="page-audio" class="page">
    <img src="" id="gargAImelAudio">
    <div class="discussion-box">
    <div id="messages"></div>
    <div class="textbox-audio">
      <textarea id="userRequest" placeholder="Hi hi ! Que veux-tu savoir ?"></textarea>
      <br></br>
      <div class="icons">
        <div class="options">
          <img src="img/Icon.svg" id="fileButton">
          <img src="img/double arrow.svg" onclick="">
          <img src="img/mic.svg" onclick="">
        </div>
        <img src="img/send.svg" id="sendButtonDiscussion">
      </div>
      </div>
    </div>
    

  </main>
  <script src="renderer.js"></script>
</body>
</html>
